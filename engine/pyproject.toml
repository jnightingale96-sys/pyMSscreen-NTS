[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrms-nts"
dynamic = ["version"]
description = "HRMS non-target screening: Level 5/4/3/2b/2a/1 identification, semi-quantification and product-ion prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.3", "pyteomics>=4.7", "psims>=1.3", "lxml>=5.0",
  "rdkit>=2023.9.1", "matplotlib>=3.8", "openpyxl>=3.1", "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hrms-nts = "hrms_nts.cli:main"

[tool.setuptools]
packages = ["hrms_nts"]

[tool.setuptools.dynamic]
version = { attr = "hrms_nts.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
