name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "engine[dev,colab]"
      - name: Engine unit tests (no databases needed; MetFrag tests skip themselves)
        working-directory: engine
        run: python -m pytest tests -q
      - name: Notebook builds and every cell parses
        run: |
          python colab/make_notebook.py
          python - <<'EOF'
          import ast, json
          nb = json.load(open("colab/HRMS_NTS_Colab.ipynb", encoding="utf-8"))
          code = [c for c in nb["cells"] if c["cell_type"] == "code"]
          for c in code:
              ast.parse("".join(c["source"]))
          print(len(nb["cells"]), "cells,", len(code), "code cells parse")
          EOF
      - name: Notebook in the repository is up to date
        run: git diff --exit-code -- colab/HRMS_NTS_Colab.ipynb
